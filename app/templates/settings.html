{% extends "base.html" %}
{% block title %}Settings - Smart Energy{% endblock %}
{% block page_title %}Settings{% endblock %}

{% block extra_css %}
<style>
    .settings-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; margin-bottom: 25px; }
    .settings-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .settings-title i { color: var(--accent-blue); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--text-primary); font-size: 14px; }
    .form-group input:focus { outline: none; border-color: var(--accent-blue); }
    .btn { padding: 12px 24px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: var(--accent-blue); color: white; }
</style>
{% endblock %}

{% block content %}
<div class="settings-card">
    <div class="settings-title"><i class="fas fa-user"></i> Profile</div>
    <div class="form-group">
        <label>Username</label>
        <input type="text" value="{{ user.username }}" readonly>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" value="{{ user.email }}">
    </div>
    <button class="btn btn-primary">Save Changes</button>
</div>

<div class="settings-card">
    <div class="settings-title"><i class="fas fa-pound-sign"></i> Tariff Settings</div>
    <div class="form-group">
        <label>Current Tariff</label>
        <select>
            <option selected>Standard Variable (£0.28/kWh)</option>
            <option>Economy 7</option>
            <option>Fixed Rate</option>
        </select>
    </div>
</div>
{% endblock %}
