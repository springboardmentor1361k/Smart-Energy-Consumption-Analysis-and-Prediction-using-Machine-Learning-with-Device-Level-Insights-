<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Prediction Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-4">⚡ Energy Consumption Prediction</h2>

<div class="card shadow p-4">

<form action="/predict" method="post">

<div class="mb-3">
<label class="form-label">Enter 24 hourly energy values</label>

<input type="text"
class="form-control"
name="values"
placeholder="0.5,0.6,0.4,0.3,... (24 values)"
required>

</div>

<button class="btn btn-primary w-100">
Predict Energy
</button>

</form>

</div>


{% if prediction %}

<div class="card shadow mt-4 p-4 text-center">

<h4>Predicted Energy Consumption</h4>

<h2 class="text-success">{{ prediction }}</h2>

</div>

<div class="card shadow mt-4 p-4">

<h5 class="text-center">Input Energy Graph</h5>

<canvas id="energyChart"></canvas>

</div>

<script>

let values = "{{ values }}".split(",").map(Number);

new Chart(document.getElementById("energyChart"), {

type: "line",

data: {
labels: [...Array(24).keys()].map(i => "Hour " + (i+1)),
datasets: [{
label: "Energy Input",
data: values,
borderWidth: 2,
fill: false
}]
}

});

</script>

{% endif %}

</div>

</body>
</html>
